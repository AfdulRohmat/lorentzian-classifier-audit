<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SP500 M30 tail-miss Monte Carlo</title>
<desc id="desc">Strategy resilience deteriorates sharply when twenty to thirty percent of greater-than-three-R winners are missed.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="80.00" y="68.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start">SP500 M30 tail-miss Monte Carlo</text>
<text x="80.00" y="108.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#657087" text-anchor="start">20,000 simulations per scenario · only &gt;3R winners may be missed · every losing trade retained</text>
<rect x="150.0" y="190.0" width="1365.0" height="405.0" rx="10" fill="#f7f9fc"/>
<rect x="150.0" y="690.0" width="1365.0" height="130.0" rx="10" fill="#f7f9fc"/>
<line x1="150.0" y1="563.85" x2="1515.0" y2="563.85" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="571.85" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">-40R</text>
<line x1="150.0" y1="501.54" x2="1515.0" y2="501.54" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="509.54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">-20R</text>
<line x1="150.0" y1="439.23" x2="1515.0" y2="439.23" stroke="#dfe5ef" stroke-width="2"/>
<text x="130.00" y="447.23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">+0R</text>
<line x1="150.0" y1="376.92" x2="1515.0" y2="376.92" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="384.92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">+20R</text>
<line x1="150.0" y1="314.62" x2="1515.0" y2="314.62" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="322.62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">+40R</text>
<line x1="150.0" y1="252.31" x2="1515.0" y2="252.31" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="260.31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">+60R</text>
<line x1="150.0" y1="190.00" x2="1515.0" y2="190.00" stroke="#dfe5ef" stroke-width="1"/>
<text x="130.00" y="198.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="end">+80R</text>
<polygon points="150.00,212.53 605.00,233.29 1060.00,287.84 1515.00,353.31 1515.00,577.36 1060.00,484.16 605.00,376.99 150.00,316.64" fill="#a9cce8" opacity="0.62"/>
<path d="M 150.00 249.98 L 605.00 291.96 L 1060.00 375.96 L 1515.00 458.79" fill="none" stroke="#1769aa" stroke-width="5.0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="150.00" y1="316.64" x2="150.00" y2="212.53" stroke="#1769aa" stroke-width="3"/>
<circle cx="150.00" cy="249.98" r="8" fill="#1769aa"/>
<text x="150.00" y="229.98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">+60.7R</text>
<text x="150.00" y="858.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#657087" text-anchor="middle">5% tails missed</text>
<line x1="605.00" y1="376.99" x2="605.00" y2="233.29" stroke="#1769aa" stroke-width="3"/>
<circle cx="605.00" cy="291.96" r="8" fill="#1769aa"/>
<text x="605.00" y="271.96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">+47.3R</text>
<text x="605.00" y="858.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#657087" text-anchor="middle">10% tails missed</text>
<line x1="1060.00" y1="484.16" x2="1060.00" y2="287.84" stroke="#1769aa" stroke-width="3"/>
<circle cx="1060.00" cy="375.96" r="8" fill="#1769aa"/>
<text x="1060.00" y="355.96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">+20.3R</text>
<text x="1060.00" y="858.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#657087" text-anchor="middle">20% tails missed</text>
<line x1="1515.00" y1="577.36" x2="1515.00" y2="353.31" stroke="#1769aa" stroke-width="3"/>
<circle cx="1515.00" cy="458.79" r="8" fill="#1769aa"/>
<text x="1515.00" y="438.79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">-6.3R</text>
<text x="1515.00" y="858.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#657087" text-anchor="middle">30% tails missed</text>
<text x="80.00" y="164.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#172033" text-anchor="start">Final total R: median and 95% interval</text>
<text x="80.00" y="662.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#172033" text-anchor="start">Chance total R stays positive</text>
<rect x="85.00" y="690.00" width="130.00" height="130.00" rx="8" fill="#158f84" opacity="0.82"/>
<text x="150.00" y="680.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#158f84" text-anchor="middle">100.0%</text>
<rect x="540.00" y="690.12" width="130.00" height="129.88" rx="8" fill="#158f84" opacity="0.82"/>
<text x="605.00" y="680.12" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#158f84" text-anchor="middle">99.9%</text>
<rect x="995.00" y="705.27" width="130.00" height="114.73" rx="8" fill="#158f84" opacity="0.82"/>
<text x="1060.00" y="695.27" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#158f84" text-anchor="middle">88.3%</text>
<rect x="1450.00" y="772.87" width="130.00" height="47.13" rx="8" fill="#158f84" opacity="0.82"/>
<text x="1515.00" y="762.87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#158f84" text-anchor="middle">36.3%</text>
<path d="M 150.00 793.71 L 605.00 781.61 L 1060.00 756.97 L 1515.00 721.75" fill="none" stroke="#d69816" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150.00" cy="793.71" r="7" fill="#d69816"/>
<text x="163.00" y="800.71" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#966800" text-anchor="start">DD 25.1%</text>
<circle cx="605.00" cy="781.61" r="7" fill="#d69816"/>
<text x="618.00" y="788.61" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#966800" text-anchor="start">DD 27.4%</text>
<circle cx="1060.00" cy="756.97" r="7" fill="#d69816"/>
<text x="1073.00" y="763.97" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#966800" text-anchor="start">DD 32.1%</text>
<circle cx="1515.00" cy="721.75" r="7" fill="#d69816"/>
<text x="1502.00" y="728.75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#966800" text-anchor="end">DD 38.9%</text>
<text x="80.00" y="888.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#657087" text-anchor="start">Blue: final R distribution · green: P(total R &gt; 0) · gold: median 1% sizing drawdown</text>
<text x="1520.00" y="888.00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#657087" text-anchor="end">Tail-risk stress test, not a return forecast</text>
</svg>
